<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreatorRadar — Find UK TikTok Live creators</title>
    <link rel="icon" href="/favicon.png?v=logo-header-3" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png?v=logo-header-3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/landing.css?v=username-only-1" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="atmosphere-orb atmosphere-orb-a"></div>
      <div class="atmosphere-orb atmosphere-orb-b"></div>
      <div class="atmosphere-grid"></div>
      <div class="atmosphere-scan"></div>
    </div>

    <header class="topbar">
      <a class="topbar-brand" href="/" aria-label="CreatorRadar home">
        <img src="/favicon.png?v=logo-header-3" alt="" width="36" height="36" />
        <span>CreatorRadar</span>
      </a>
      <nav class="topbar-nav">
        <button type="button" class="btn btn-solid" data-open="login">Log in</button>
      </nav>
    </header>

    <main class="hero">
      <div class="hero-copy">
        <p class="brand-mark" aria-hidden="true">CreatorRadar</p>
        <h1>UK Live creators, ready for outreach.</h1>
        <p class="lede">
          Your assigned lead board — status tracking, backstage-ready leads to copy and paste and scouting DM generator all in one place!
        </p>
        <div class="cta-row">
          <button type="button" class="btn btn-solid btn-lg" data-open="login">Log in</button>
        </div>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <div class="radar-ring ring-1"></div>
        <div class="radar-ring ring-2"></div>
        <div class="radar-ring ring-3"></div>
        <div class="radar-sweep"></div>
        <div class="radar-core">
          <img src="/favicon.png?v=logo-header-3" alt="" width="88" height="88" />
        </div>
      </div>
    </main>

    <footer class="landing-footer">
      <p>
        Created by
        <a
          href="https://www.tiktok.com/@therealonesliveagency"
          target="_blank"
          rel="noopener noreferrer"
          >Jamie Mathieson</a
        >
      </p>
    </footer>

    <div class="modal-root hidden" id="modal-root" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button type="button" class="modal-close" data-close aria-label="Close">×</button>
        <h2 id="modal-title">Log in</h2>
        <p class="modal-sub" id="modal-sub">Access your CreatorRadar account.</p>
        <form id="auth-form" class="auth-form" novalidate>
          <label class="field">
            <span>Username</span>
            <input id="field-login" name="login" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input id="field-password" name="password" type="password" autocomplete="current-password" />
          </label>
          <p class="form-error hidden" id="form-error" role="alert"></p>
          <button type="submit" class="btn btn-solid btn-block" id="auth-submit">Log in</button>
        </form>
      </div>
    </div>

    <script src="/landing.js?v=username-only-1"></script>
  </body>
</html>
