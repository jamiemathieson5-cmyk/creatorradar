# CreatorRadar — force Dockerfile (Chromium + SCRAPE_MODE=tiktok_feed).
# TikLeap is not used in production.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
# Give the process a moment to bind PORT before health probes / traffic.
overlapSeconds = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
